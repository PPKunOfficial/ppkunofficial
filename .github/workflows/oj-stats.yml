name: Update OJ Stats

on:
  schedule:
    # 03:17 Asia/Shanghai (19:17 UTC). GitHub 的 schedule 可能延迟数小时，
    # 卡片右下角显示实际运行时间。
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oj-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Render OJ charts
        run: python3 scripts/oj_stats/main.py

      - name: Commit updated charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- assets/oj)" ]; then
            echo "No chart changes"
            exit 0
          fi
          git add assets/oj
          git commit -m "chore(oj-stats): refresh charts"
          git push
